databaseChangeLog:
  - changeSet:
      id: create-items
      author: "Ilya Seredich"
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_items
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: numeric(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_items_name
            tableName: items
            columns:
              - column:
                  name: name
        - addUniqueConstraint:
            tableName: items
            columnNames: name
            constraintName: uk_items_name